<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бюджет</title>

<style>
body{
font-family:Arial;
background:#0f1220;
color:white;
margin:0;
padding:20px;
}

.card{
background:#1c2036;
padding:15px;
border-radius:12px;
margin-bottom:12px;
}

input{
width:100%;
padding:10px;
margin:5px 0;
border-radius:8px;
border:none;
}

button{
padding:10px;
border:none;
border-radius:8px;
background:#6c7bff;
color:white;
margin-top:5px;
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.small{
font-size:12px;
opacity:0.7;
}

.item{
display:flex;
justify-content:space-between;
margin:6px 0;
background:#2a2f4a;
padding:8px;
border-radius:8px;
}
</style>
</head>

<body>

<h2>💸 Бюджет Софа + Артём</h2>

<div class="card">
<h3>💳 Кредитка</h3>
<input id="goal" placeholder="Цель (131000)">
<input id="paid" placeholder="Внесено">
<div class="small" id="left"></div>
</div>

<div class="card">
<h3>📅 План</h3>

<div id="plan"></div>
</div>

<script>

let data = JSON.parse(localStorage.getItem("budget2")) || {
goal:131000,
paid:0,
plan:[
{d:"1–3",t:"ЗП ты",a:0},
{d:"10",t:"ЗП Артём",a:0},
{d:"10",t:"Квартира",a:0},
{d:"15",t:"Сбер",a:0},
{d:"16–18",t:"ЗП ты",a:0},
{d:"25",t:"Коммуналка",a:0},
]
};

function save(){
localStorage.setItem("budget2",JSON.stringify(data));
render();
}

function render(){

document.getElementById("goal").value=data.goal;
document.getElementById("paid").value=data.paid;

document.getElementById("left").innerText =
"Осталось: " + (data.goal-data.paid);

let p=document.getElementById("plan");
p.innerHTML="";

data.plan.forEach((x,i)=>{
let div=document.createElement("div");
div.className="item";
div.innerHTML=`
<div>
<b>${x.d}</b> ${x.t}
</div>
<input type="number" value="${x.a}" onchange="upd(${i},this.value)">
`;
p.appendChild(div);
});
}

function upd(i,v){
data.plan[i].a=Number(v)||0;
save();
}

document.getElementById("goal").oninput=e=>{
data.goal=Number(e.target.value)||0;
save();
};

document.getElementById("paid").oninput=e=>{
data.paid=Number(e.target.value)||0;
save();
};

render();

</script>

</body>
</html>
